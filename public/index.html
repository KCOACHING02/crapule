/* ================= Emploi du temps ================= */
function vEdt(M){
  const cs=((S.ed&&S.ed.cours)||[]), ctl=((S.ed&&S.ed.controles)||[]), today=dkey(Date.now());
  const days=[...new Set(cs.map(c=>c.d))].filter(d=>d>=today).sort();
  let sel=S.param&&days.includes(S.param)?S.param:(days.includes(today)?today:days[0]);
  const nmC=m=>{const n=normMatiere(m);return MATIERES.some(x=>x.n===n)?n:String(m).replace(/^E\d+\s*-\s*/i,'').toLowerCase().replace(/^./,x=>x.toUpperCase())};
  const lbl=d=>{const t=parseKey(d);const w=new Date(t).toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','');return {w:w.charAt(0).toUpperCase()+w.slice(1),n:new Date(t).getDate()}};
  const draw=()=>{
    const list=cs.filter(c=>c.d===sel), ctD=ctl.filter(c=>c.d===sel||c.date===sel), dv=(S.devoirs||[]).filter(d=>d.pour===sel&&d.statut==='a_faire');
    const now=new Date().toTimeString().slice(0,5);
    M.innerHTML=`${banner()}<a href="#" class="back" id="eb">‹ Accueil</a><div class="top"><div><h1>📅 Mon emploi du temps</h1><p class="sub">${S.ed?`D'après EcoleDirecte · mis à jour ${ago(S.ed.maj)}`:'Relie EcoleDirecte pour voir tes cours ici automatiquement.'}</p></div></div>
    ${days.length?`<div class="edays">${days.map(d=>{const L=lbl(d);return `<button class="eday ${d===sel?'on':''} ${d===today?'tdy':''}" data-d="${d}"><small>${L.w}</small><b>${L.n}</b>${ctl.some(c=>(c.date||c.d)===d)?'<i>📝</i>':''}</button>`}).join('')}</div>
    <h2 style="margin:16px 0 10px">${(()=>{const s0=new Date(parseKey(sel)).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});return (sel===today?"Aujourd'hui · ":'')+s0.charAt(0).toUpperCase()+s0.slice(1)})()}</h2>
    ${ctD.map(c=>`<div class="ectl">📝 <b>Contrôle de ${esc(nmC(c.matiere))}</b>${c.titre?` · ${esc(c.titre)}`:''}</div>`).join('')}
    ${dv.map(d=>`<div class="ectl dv" data-dev="${d.id}">✏️ <b>À rendre :</b> ${esc(d.titre)}</div>`).join('')}
    <div class="eclist">${list.length?list.map(c=>{const n=nmC(c.m),i=matInfo(normMatiere(c.m)),past=sel===today&&c.f<now,cur=sel===today&&c.h<=now&&c.f>=now;return `<div class="ecours ${c.annule?'off':''} ${past?'past':''} ${cur?'cur':''}" style="--c:${i.c}"><div class="eh"><b>${c.h}</b><small>${c.f}</small></div><div class="sp"><b>${i.e} ${esc(n)}</b><small>${[c.salle&&'🚪 '+esc(c.salle),c.prof&&'👤 '+esc(c.prof)].filter(Boolean).join(' · ')}</small>${c.annule?'<span class="tag" style="background:#fde2e2;color:var(--bad)">❌ Annulé</span>':c.modif?'<span class="tag">⚠️ Modifié</span>':''}${cur?'<span class="tag" style="background:var(--fox);color:#fff">En ce moment</span>':''}</div></div>`}).join(''):'<p class="muted">Pas de cours ce jour-là 😎</p>'}</div>`
    :`<div class="card" style="text-align:center">${mascot(S.ed?"Pas de cours trouvés pour les 2 prochaines semaines.":"Relie EcoleDirecte (Moi → Profil) et ton emploi du temps apparaîtra ici.",60)}</div>`}`;
    $('#eb').onclick=e=>{e.preventDefault();go('home')};
    M.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{sel=b.dataset.d;draw()});
    M.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>go('devoir',b.dataset.dev));
    const on=M.querySelector('.eday.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'});
  };
  draw();
}

/* ================= Mes notes ================= */
function noteChart(ns,color){
  const pts=ns.slice().sort((a,b)=>a.date-b.date); if(!pts.length) return '';
  const W=320,H=130,pl=26,pr=10,pt=10,pb=22, n=pts.length;
  const x=i=>n===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(n-1), y=v=>pt+(20-v)*(H-pt-pb)/20;
  const vs=pts.map(r=>r.score*20);
  let avg=[],sw=0,sv=0; pts.forEach((r,i)=>{const w=r.coef||1;sw+=w;sv+=vs[i]*w;avg.push(sv/sw)});
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg class="nchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Évolution des notes">
    ${[0,5,10,15,20].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v===10?'#e3494855':'var(--line)'}" stroke-width="1" ${v===10?'stroke-dasharray="4 3"':''}/><text x="${pl-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9" fill="var(--ink3)">${v}</text>`).join('')}
    ${n>1?`<path d="${path(avg)}" fill="none" stroke="${color}" stroke-width="2" stroke-opacity=".35" stroke-dasharray="5 4"/><path d="${path(vs)}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`:''}
    ${pts.map((r,i)=>`<circle cx="${x(i)}" cy="${y(vs[i])}" r="${4+Math.min(3,(r.coef||1)-1)}" fill="${vs[i]<10?'#e34948':vs[i]<12?'#e0a800':'#1baf7a'}" stroke="var(--paper)" stroke-width="2"><title>${esc(r.titre||'')} : ${esc(r.note||'')}</title></circle>`).join('')}
    ${pts.map((r,i)=>i===0||i===n-1||n<=6?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink3)">${new Date(r.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}).replace('.','')}</text>`:'').join('')}
  </svg><div class="nleg"><span><i style="background:${color}"></i>tes notes</span>${n>1?`<span><i style="background:${color};opacity:.4"></i>ta moyenne</span>`:''}<span><i style="background:#e34948;opacity:.5"></i>10/20</span></div>`;
}
function pendingCopiesCard(){
  if(S.isOwner) return ''; const ns=notesToAnalyse(); if(!ns.length) return '';
  const col=v=>v<10?'lo':v<12?'mi':'hi';
  return `<div class="pcop"><div class="row"><h2 style="margin:0" class="sp">📸 Copies à prendre en photo</h2><span class="cnt">${ns.length}</span></div>
    <p class="muted" style="font-size:13px;margin:4px 0 8px">Photographie chaque copie corrigée : je te montre où tu as perdu des points.</p>
    <div class="pclist">${ns.map(r=>{const v=r.score*20;return `<button class="pcrow" data-copy="${r.id}"><b class="pcn ${col(v)}">${esc(r.note||v.toFixed(1)+'/20')}</b><div class="sp"><b>${esc(r.titre||'Devoir')}</b><small>${matInfo(normMatiere(r.matiere)).e} ${esc(normMatiere(r.matiere))} · ${fmtDate(r.date)}</small></div><span class="pcgo">📸</span></button>`}).join('')}</div></div>`;
}
function generalAvg(){const sc=MATIERES.filter(m=>m.n!=='Autre').map(m=>subjScore(m.n)).filter(x=>x&&x.lab.startsWith('moyenne'));if(!sc.length) return null;const v=sc.reduce((a,x)=>a+x.v,0)/sc.length;return {v,txt:v.toFixed(1).replace('.',',').replace(',0','')};}
function vNotes(M){
  const notes=S.results.filter(r=>r.type==='note');
  const mats=[...new Set(notes.map(r=>r.matiere))].sort((a,b)=>{const ia=MATIERES.findIndex(x=>x.n===a),ib=MATIERES.findIndex(x=>x.n===b);return (ia<0?99:ia)-(ib<0?99:ib)});
  const g=generalAvg(), col=v=>v<10?'lo':v<12?'mi':'hi';
  M.innerHTML=`${banner()}<a href="#" class="back" id="nb">‹ Accueil</a><div class="top"><div><h1>🧾 Mes notes</h1><p class="sub">${S.ed?`D'après EcoleDirecte · mis à jour ${ago(S.ed.maj)}`:'Relie EcoleDirecte pour récupérer tes notes automatiquement.'}</p></div></div>
  ${g?`<div class="gavg"><div><small>MOYENNE GÉNÉRALE</small><b class="${col(g.v)}">${g.txt}<span>/20</span></b></div><div class="gbars">${mats.map(n=>{const sc=subjScore(n);return sc?`<div title="${esc(n)} ${sc.txt}"><i style="height:${Math.max(6,sc.v/20*100)}%;background:${matInfo(n).c}"></i><small>${matInfo(n).e}</small></div>`:''}).join('')}</div></div>`:''}
  ${mats.length?mats.map(n=>{const i=matInfo(n),sc=subjScore(n),ns=notes.filter(r=>r.matiere===n).sort((a,b)=>b.date-a.date);return `<details class="nsub" style="--c:${i.c}" open><summary><span class="ne">${i.e}</span><div class="sp"><b>${esc(n)}</b><small>${ns.length} note${ns.length>1?'s':''}</small></div>${sc?`<b class="navg ${col(sc.v)}">${sc.txt}</b>`:''}</summary>
    <div class="nchartw">${noteChart(ns,i.c)}</div>
    ${ns.map(r=>{const v=r.score*20;return `<div class="nrow"><div class="sp"><b>${esc(r.titre||'Note')}</b><small>${fmtDate(r.date)}${r.coef&&r.coef!==1?` · coef ${String(r.coef).replace('.',',')}`:''}${r.analyse?' · 🔍 analysée':''}</small></div>${r.analyse?`<button class="btn sm ghost" data-ana="${r.id}">🔍</button>`:`<button class="btn sm ghost" data-copy="${r.id}" title="Prendre la copie en photo">📸</button>`}<b class="nval ${col(v)}">${esc(r.note||v.toFixed(1).replace('.',',')+'/20')}</b></div>`}).join('')}
    <button class="btn sm" data-sub2="${esc(n)}" style="margin-top:8px">Ouvrir ${esc(n)} ›</button></details>`}).join('')
  :`<div class="card" style="text-align:center">${mascot(S.ed?"Pas encore de note cette année.":"Relie EcoleDirecte (Moi → Profil) et tes notes apparaîtront ici.",60)}</div>`}`;
  $('#nb').onclick=e=>{e.preventDefault();go('home')};
  bindCommon(M); bindCopies(M);
}
async function startApp(){
  S.aiKey=ME.aiKey!==false;
  if(!S.profile.prenom&&ME.nom) S.profile.prenom=ME.nom;
  await initStore();
  if(!S.profile.prenom&&ME.nom) S.profile.prenom=ME.nom;
  applyTheme();
  const h=location.hash.slice(1); if(['planning','devoirs','trophees','fiches','progress','suivi','import','cours','moi','oral','aide'].includes(h)) S.view=h;
  S.ready=true; render(); publishSummary();
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js'); }catch(e){}
  addEventListener('offline',()=>{toast('📴 Hors connexion : tes fiches et cartes restent disponibles');render()});
  addEventListener('online',()=>{toast('✅ De retour en ligne');render()});
  if(!S.profile.niveau&&ME.role!=='parent'){S.profile.niveau='BTS MCO';saveProfile().catch(()=>{});}
  if(!S.profile.onboarded&&ME.role!=='parent') setTimeout(()=>onboarding(),300);
}
(async()=>{
  try{const j=await API.req('GET','/api/me'); ME={...j.user,aiKey:j.ai,ocr:!!j.ocr}; startApp();}
  catch(e){ if(e.code==='offline') $('#main').innerHTML='<div class="banner">Pas de connexion internet. Réessaie dans un instant.</div>'; else showLogin(false); }
})();
