<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crapule — ton carnet de révision</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<meta name="theme-color" content="#1e2a4a">
<script>try{var t=localStorage.getItem("crapule.theme")||"auto";if(t==="sombre"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crapule">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#f7f4ee; --paper:#fffdf9; --ink:#1f1d1a; --ink2:#5b574f; --ink3:#8d887d;
  --line:#e7e1d6; --line2:#d9d1c2;
  --hl:#ffe14d; --hl-soft:#fff3b0;
  --brand:#1e2a4a; --brand-2:#2c3c66; --brand-soft:#e7eaf3; --fox:#f2762e; --fox-soft:#fde8da; --input:#fff;
  --good:#1f7a45; --warn:#b86a00; --bad:#c23b3b;
  --radius:16px; --shadow:0 1px 2px rgba(40,30,10,.05),0 6px 24px -12px rgba(40,30,10,.18);
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* Sidebar */
.side{background:var(--paper);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.logo{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.02em;padding:0 8px;display:flex;align-items:center;gap:8px}
.logo mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink2);font-weight:500}
.nav button:hover{background:var(--bg)}
.nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .ico{width:20px;text-align:center}
.side h6{margin:6px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.side .count{margin-left:auto;font-size:12px;color:var(--ink3)}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink3);padding:0 10px}
/* Main */
.main{padding:28px clamp(16px,4vw,48px) 80px;max-width:1180px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:clamp(26px,3.2vw,34px);line-height:1.15;margin:0;letter-spacing:-.02em}
h2{font-family:var(--serif);font-size:21px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--ink2);margin:6px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:11px;font-weight:600;font-size:14px;transition:.15s}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.hl{background:var(--hl);border-color:#e8c800;color:#2a2400}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--paper)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.stat .v{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1.1}
.stat .l{color:var(--ink2);font-size:13px}
.muted{color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.lvl{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;gap:5px;align-items:center}
.lvl.l0{background:#f1efea;color:var(--ink2)}
.lvl.l1{background:#fbe4e2;color:var(--bad)}
.lvl.l2{background:#fdecd2;color:var(--warn)}
.lvl.l3{background:#dff1e5;color:var(--good)}
.lvl.l4{background:var(--brand-soft);color:var(--brand)}
/* subject card */
.subj{cursor:pointer;position:relative;overflow:hidden;transition:.15s}
.subj:hover{transform:translateY(-2px)}
.subj .band{position:absolute;left:0;top:0;bottom:0;width:5px}
.subj .emo{font-size:26px}
.bar{height:8px;background:#efebe3;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand)}
/* course list */
.clist{display:flex;flex-direction:column;gap:10px}
.citem{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:.15s}
.citem:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.citem .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none}
.citem .t{font-weight:600}
.citem .d{font-size:13px;color:var(--ink2)}
/* drop */
.drop{border:2px dashed var(--line2);border-radius:20px;background:var(--paper);padding:40px 20px;text-align:center;transition:.15s;cursor:pointer}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop .big{font-size:44px}
.qitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.spin{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
textarea.inp,input.inp,select.inp{width:100%;border:1px solid var(--line2);border-radius:11px;background:#fff;padding:10px 12px;outline:none}
textarea.inp:focus,input.inp:focus,select.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 20px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
/* prose */
.prose{max-width:760px}
.prose h1,.prose h2,.prose h3{font-family:var(--serif);margin:1.2em 0 .4em}
.prose h1{font-size:24px}.prose h2{font-size:20px}.prose h3{font-size:17px}
.prose p{margin:.5em 0}
.prose ul,.prose ol{padding-left:1.3em;margin:.4em 0}
.prose li{margin:.2em 0}
.prose code{background:#f1ede4;padding:1px 5px;border-radius:5px;font-size:.92em}
.prose strong{background:linear-gradient(transparent 60%,var(--hl-soft) 60%)}
.prose blockquote{margin:.6em 0;padding:8px 14px;border-left:3px solid var(--hl);background:#fffbe6;border-radius:0 8px 8px 0}
/* fiche */
.fiche{display:grid;gap:14px;max-width:880px}
.fbox{border-radius:14px;padding:16px 18px;border:1px solid var(--line);background:var(--paper)}
.fbox h4{margin:0 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.fbox.ess{background:#fffbe3;border-color:#f1e08a}
.fbox.ess p{font-family:var(--serif);font-size:18px;margin:0}
.fbox.trap{background:#fdf0ee;border-color:#f3cdc8}
.fbox.mnemo{background:var(--brand-soft);border-color:#c5e0d8}
.defs{display:grid;gap:8px}
.defs div{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.defs b{font-weight:700}
.formula{font-family:ui-monospace,Menlo,monospace;background:#f6f3ec;padding:8px 12px;border-radius:9px;margin:4px 0;display:block}
/* flashcards */
.flash{perspective:1000px;height:220px;cursor:pointer;max-width:520px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;padding:24px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.flash .f{background:var(--paper);font-family:var(--serif);font-size:22px;font-weight:700}
.flash .b{background:var(--brand);color:#fff;transform:rotateY(180deg)}
/* quiz */
.qcard{max-width:720px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line2);background:var(--paper);padding:13px 16px;border-radius:13px;margin:8px 0;font-weight:500;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--brand);background:#fafdfb}
.opt.ok{border-color:var(--good);background:#e7f5ec}
.opt.ko{border-color:var(--bad);background:#fbe9e7}
.opt:disabled{cursor:default}
.progress{height:6px;background:#ece7dc;border-radius:99px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--hl);transition:.3s}
.explain{margin-top:12px;padding:12px 14px;border-radius:12px;background:#f6f3ec;font-size:14px}
.score{font-family:var(--serif);font-size:56px;font-weight:700;line-height:1}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px;max-width:820px}
.msg{padding:12px 16px;border-radius:16px;max-width:88%}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.composer{display:flex;gap:8px;position:sticky;bottom:12px;background:var(--bg);padding-top:8px}
/* exercises */
.exo{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--paper);margin-bottom:14px}
.diff{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grade{margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s}
/* planning */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.task .tt{font-weight:600;font-size:14px}
.task .td{font-size:12px;color:var(--ink3);margin-top:2px}
.task.done{background:#f6f3ec}
.task.done .tt{text-decoration:line-through;color:var(--ink3)}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);background:#fff;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;font-size:13px;padding:0}
.task.done .chk{background:var(--good);border-color:var(--good)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.exams{display:flex;gap:12px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px}
.exam{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-top:4px solid;border-radius:14px;padding:12px 14px;min-width:250px;box-shadow:var(--shadow)}
.exam .jx{font-family:var(--serif);font-weight:700;font-size:22px;min-width:52px}
.days{display:flex;flex-direction:column;gap:10px}
.dayc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dayc.rest{opacity:.6}
.dayc .dh{display:flex;justify-content:space-between;font-size:14px}
.dayc .task{padding:7px 10px;border-radius:10px}
.exday{background:#fff3b0;border-radius:9px;padding:6px 10px;font-weight:600;font-size:13px}
@media (max-width:820px){.mobilebar button{padding:4px 4px}}
.pill{background:var(--hl);color:#2a2400;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:4px}
.steps{display:flex;flex-direction:column;gap:14px;max-width:860px}
.step{display:flex;gap:16px;align-items:flex-start}
.sn{width:30px;height:30px;border-radius:50%;background:var(--hl);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--serif)}
.err{padding:8px 0;border-bottom:1px dashed #efc9c3;font-size:14px}
.err:last-child{border:0}
.err .ex{font-style:italic;color:var(--ink2)}
.err .fix{color:var(--good);font-weight:600}
.duebox{background:#fff6d6;border:1px solid #f0dc8a;border-radius:12px;padding:8px 12px;margin:10px 0 4px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;font-family:var(--serif)}
.lvtable{display:flex;flex-direction:column;gap:6px}
.lvrow{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(80px,1fr) 34px auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fcard{cursor:pointer;transition:.15s}.fcard:hover{transform:translateY(-2px)}
@media (max-width:820px){.lvrow{grid-template-columns:1fr 50px}.lvrow .bar{grid-column:1/-1}.step{gap:10px}}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:60;padding:16px}
.login-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:30px 26px;width:min(380px,100%);box-shadow:var(--shadow)}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-block;vertical-align:middle;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.av-txt{background:var(--brand);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-family:var(--serif)}

/* ===== Crapule : mascotte, jeu ===== */
.fox{flex:none;display:block}
.fox.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
.mascot{display:flex;align-items:flex-end;gap:12px}
.mascot .bubble{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 16px;box-shadow:var(--shadow);font-size:15px;max-width:520px;text-align:left}
.hero{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap}
.hero-l{display:flex;flex-direction:column;gap:16px;flex:1;min-width:260px}
.hero-r{display:flex;align-items:center;gap:12px}
.cta{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:space-between;gap:14px;background:var(--fox);color:#fff;font-weight:700;font-size:18px;padding:16px 22px;border-radius:16px;box-shadow:0 8px 22px -10px rgba(242,118,46,.8);max-width:460px;transition:.15s}
.cta:hover{transform:translateY(-2px)}
.cta span{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:99px;font-size:14px}
.cta.done{background:var(--good)}
.xpchip{display:inline-flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;margin:0 8px}
.side .xpchip{margin:0 4px}
.xpchip .flame{color:var(--fox)}.xpchip .flame.off{color:var(--ink3);filter:grayscale(1)}
.xpchip .xpbar{width:60px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}.xpchip .xpbar i{display:block;height:100%;background:var(--fox)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px;opacity:.55}
.badge.on{opacity:1;border-color:#f4c7a6;box-shadow:var(--shadow)}
.badge .be{font-size:30px}.badge small{color:var(--ink3);font-size:12px}
.trophy{text-align:center}.big-n{font-family:var(--serif);font-size:34px;font-weight:700}
.rw{display:flex;gap:12px;align-items:center}.rwi{font-size:24px}.rw.done{opacity:.6}.rw.won b{color:var(--good)}
.reward-won{background:var(--fox-soft);border:2px dashed var(--fox);border-radius:14px;padding:12px;font-weight:700;font-size:18px;margin:8px 0}
.xpgain{display:inline-block;background:var(--fox-soft);color:var(--fox);font-weight:800;padding:4px 12px;border-radius:99px;margin:2px}.xpgain.rec{background:#fff3b0;color:#7a5b00}
.combo{margin-left:10px;color:var(--fox);font-weight:800;animation:pop .3s}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.timer{position:relative;height:10px;background:var(--line);border-radius:99px;margin:-8px 0 18px;overflow:hidden}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--good);transition:width .1s linear}.timer i.low{background:var(--bad)}
.timer span{position:absolute;right:6px;top:-18px;font-size:12px;font-weight:700;color:var(--ink2)}
.chrono-opt{display:flex;align-items:center;gap:8px;padding:12px 14px;border:1.5px dashed var(--line2);border-radius:12px;cursor:pointer}
.explain.good{background:#e7f5ec}.explain.bad{background:#fbe9e7}
.speak{all:unset;cursor:pointer;font-size:14px;opacity:.6;margin-top:6px;display:inline-block;padding:2px 6px;border-radius:8px}
.speak:hover,.speak.on{opacity:1;background:var(--fox-soft)}
.speak-f.on{background:var(--fox-soft);border-color:var(--fox)}
.mic{font-size:18px;padding:9px 12px}.mic.rec{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.prefs{margin-top:16px;padding:12px 14px;background:var(--bg);border-radius:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.onb{text-align:center;padding:6px 4px}.onb .fox{margin:0 auto}.onb-e{font-size:34px;margin:-6px 0 4px}.onb h2{margin:6px 0}.onb p{color:var(--ink2);line-height:1.6}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--fox);width:22px;border-radius:99px}
#fab{display:none}
.mtop{display:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
@media (max-width:820px){
  #fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--fox);color:#fff;font-size:26px;box-shadow:0 10px 24px -8px rgba(242,118,46,.9);z-index:35;cursor:pointer}
  .hero-r{display:none}.mtop{display:flex;align-items:center;margin:-8px 0 10px}.mtop .xpchip{margin:0}
  .modal{max-height:90vh;overflow:auto}.cta{font-size:16px;padding:14px 18px}
}
/* ===== Mode sombre ===== */

.streakbig{display:flex;flex-direction:column;align-items:center;background:linear-gradient(160deg,#ffb15c,var(--fox));color:#fff;border-radius:20px;padding:8px 14px;min-width:68px;box-shadow:0 8px 20px -10px rgba(242,118,46,.9)}

<script>
/* ===== Connexion au serveur Crapule (remplace l'environnement Claude) ===== */
let ME=null;
const API={
  async req(method,path,body){
    let r;
    try{r=await fetch(path,{method,headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined,credentials:'same-origin'});}
    catch(e){throw {code:'offline',message:'Pas de connexion internet'}}
    if(r.status===401&&path!=='/api/login'){if(path!=='/api/me')showLogin(true);throw {code:'session_expired',message:'Session expirée, reconnecte-toi'}}
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw {code:j.code||'upstream_error',message:j.message||('Erreur '+r.status)};
    return j;
  }
};
function blobToB64(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(b)})}
function makeSample(){
  const f=async(input,opts={})=>{
    const images=opts.images?await Promise.all([].concat(opts.images).map(blobToB64)):[];
    let r;
    try{r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',signal:opts.signal,body:JSON.stringify({input,images,tier:opts.modelTier||'default'})});}
    catch(e){throw {code:e&&e.name==='AbortError'?'cancelled':'offline',message:'Pas de connexion internet'}}
    if(!r.ok){const j=await r.json().catch(()=>({})); if(r.status===401) showLogin(true); throw {code:j.code||'upstream_error',message:j.message||('Erreur '+r.status)};}
    const reader=r.body.getReader(), dec=new TextDecoder(); let full='';
    for(;;){
      const {done,value}=await reader.read(); if(done) break;
      const prev=full.split('\u0001')[0]; full+=dec.decode(value,{stream:true}); const vis=full.split('\u0001')[0];
      if(opts.onText&&vis.length>prev.length){try{opts.onText({text:vis,delta:vis.slice(prev.length)})}catch(e){}}
    }
    const i=full.indexOf('\u0001'); let text=full, truncated=false;

function parseJSON(t){
  t=String(t||'').replace(/```json|```/g,'').trim();
  const a=Math.min(...['{','['].map(c=>{const i=t.indexOf(c);return i<0?1e9:i}));
  const b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  return JSON.parse(t.slice(a,b+1));
}
function aiErr(e){

/* ---------------- Lecture des fichiers ---------------- */
async function imageToBlob(src,max=1600){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("Image illisible (format HEIC ? exporte-la en JPG)"));i.src=src;});
  let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
}
const isImage=f=>f.type.startsWith('image/')||/\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(f.name);
const isHeic=f=>/hei[cf]/i.test(f.type)||/\.(heic|heif)$/i.test(f.name);
let heicLib=null;
function loadHeicLib(){
  if(window.heic2any) return Promise.resolve();
  if(!heicLib) heicLib=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';s.onload=res;s.onerror=()=>{heicLib=null;rej(new Error('Convertisseur iPhone non chargé'))};document.head.appendChild(s);});
  return heicLib;
}
async function fileToJpeg(file){
  const url=URL.createObjectURL(file);
  try{return await imageToBlob(url)}catch(e){ if(!isHeic(file)) throw e; }
  finally{URL.revokeObjectURL(url)}
  // Photo iPhone (HEIC) que le navigateur ne sait pas afficher : conversion
  await loadHeicLib();
  let out=await heic2any({blob:file,toType:'image/jpeg',quality:.88}); if(Array.isArray(out)) out=out[0];
  const u2=URL.createObjectURL(out); try{return await imageToBlob(u2)} finally{URL.revokeObjectURL(u2)}
}
async function readFile(file,onProgress){
  const name=file.name.toLowerCase();
  if(isImage(file)) return {text:'',images:[await fileToJpeg(file)]};
  if(name.endsWith('.pdf')||file.type==='application/pdf'){
    if(!window.pdfjsLib) throw new Error('Lecteur PDF non chargé');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const n=Math.min(pdf.numPages,60); let text='';
    for(let p=1;p<=n;p++){const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); text+=tc.items.map(i=>i.str+(i.hasEOL?'\n':' ')).join('')+'\n\n';}
    if(text.replace(/\s/g,'').length>150*Math.min(n,3)) return {text,images:[]};
    // PDF scanné : on envoie les pages en image
    const images=[], total=Math.min(pdf.numPages,80);
    for(let p=1;p<=total;p++){
      onProgress&&onProgress(`Préparation des pages scannées… ${p}/${total}`);
      const pg=await pdf.getPage(p); const vp=pg.getViewport({scale:1.6}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      images.push(await imageToBlob(cv.toDataURL('image/jpeg',.9)));
    }
    return {text:'',images,scanned:true,pages:pdf.numPages};
  }
  if(name.endsWith('.docx')){
    if(!window.mammoth) throw new Error('Lecteur Word non chargé');
    const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()}); return {text:r.value,images:[]};
  }
  if(/\.(txt|md|csv|rtf|html?)$/.test(name)||file.type.startsWith('text/')){
    let t=await file.text(); if(/\.html?$/.test(name)){const d=document.createElement('div');d.innerHTML=t;t=d.textContent;} return {text:t,images:[]};
  }
  throw new Error('Format non pris en charge (images, PDF, Word .docx ou texte)');
}

Tâches :

2. Identifie la matière${forcedMatiere?` (l'élève indique : ${forcedMatiere})`:''}. Choisis OBLIGATOIREMENT un de ces noms courts exacts (élève en BTS MCO) : ${list}.
3. Donne un titre court et clair, et le chapitre/thème général.

5. Liste 3 à 8 notions clés.
Réponds UNIQUEMENT avec ce JSON :
{"matiere":"","titre":"","chapitre":"","resume":"","notions":[""],"texte":"markdown ou null"}`;
  const r=await ask(prompt,{json:true,images:hasImg?images:null,tier:hasImg?'default':'quick'});
  let texte=(r.texte&&String(r.texte).length>40)?r.texte:(text||'');

}

/* ---------------- Niveau & progression ---------------- */
const DIFF_W={facile:.9,moyen:1,difficile:1.12};
function levelSeries(mat){
  const rs=S.results.filter(r=>r.matiere===mat&&r.type!=='cartes').sort((a,b)=>a.date-b.date);
  let lvl=null; const out=[];
  for(const r of rs){const v=Math.max(0,Math.min(100,r.score*100*(DIFF_W[r.difficulte]||1))); lvl=lvl==null?v:lvl*.65+v*.35; out.push({date:r.date,lvl:Math.round(lvl),r});}
  return out;
}
function levelOf(mat){const s=levelSeries(mat); return s.length?s[s.length-1].lvl:null;}
function lvlLabel(l){
  if(l==null) return {k:'l0',t:'Pas encore évalué',i:'○'};
  if(l<40) return {k:'l1',t:'À consolider',i:'▲'};
  if(l<60) return {k:'l2',t:'En progrès',i:'◆'};
  if(l<80) return {k:'l3',t:'Bon niveau',i:'●'};
  return {k:'l4',t:'Maîtrisé',i:'★'};
}
function lvlBadge(l){const L=lvlLabel(l);return `<span class="lvl ${L.k}">${L.i} ${L.t}${l!=null?' · '+l+'/100':''}</span>`;}
function autoDiff(mat){const l=levelOf(mat); return l==null?'moyen':l<45?'facile':l<75?'moyen':'difficile';}
function subjects(){
  const m=new Map(); for(const x of MATIERES) if(x.n!=='Autre') m.set(x.n,0);
  for(const c of S.courses){m.set(c.matiere,(m.get(c.matiere)||0)+1)}
  for(const r of S.results) if(!m.has(r.matiere)) m.set(r.matiere,0);
  return [...m.entries()].map(([n,count])=>({n,count,info:matInfo(n),lvl:levelOf(n),last:Math.max(0,...S.results.filter(r=>r.matiere===n).map(r=>r.date))})).sort((a,b)=>{const ia=MATIERES.findIndex(x=>x.n===a.n),ib=MATIERES.findIndex(x=>x.n===b.n);return (ia<0?99:ia)-(ib<0?99:ib)||b.count-a.count});
}

/* ---------------- Mini markdown ---------------- */
function md(src){
  const lines=String(src||'').replace(/\r/g,'').split('\n'); let out='',list=null;
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<em>$2</em>').replace(/`(.+?)`/g,'<code>$1</code>');
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  for(let l of lines){
    let m;
    if(m=l.match(/^(#{1,4})\s+(.*)/)){close();const n=Math.min(3,m[1].length);out+=`<h${n}>${inline(m[2])}</h${n}>`;continue}
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^>\s?(.*)/)){close();out+=`<blockquote>${inline(m[1])}</blockquote>`;continue}
    if(!l.trim()){close();continue}
    close(); out+=`<p>${inline(l)}</p>`;
  }
  close(); return out;
}

function subjScore(n){
  const notes=S.results.filter(r=>r.matiere===n&&r.type==='note');
  if(notes.length){const W=notes.reduce((a,r)=>a+(r.coef||1),0), m=notes.reduce((a,r)=>a+r.score*(r.coef||1),0)/W*20;return {v:m,txt:m.toFixed(1).replace('.',',').replace(',0',''),lab:`moyenne · ${notes.length} note${notes.length>1?'s':''}`};}

  const m=l/5; return {v:m,txt:m.toFixed(1).replace('.',',').replace(',0',''),lab:'niveau aux quiz'};
}

async function photoFromFile(file){
  let src;
  try{const b=await fileToJpeg(file); src=URL.createObjectURL(b);}catch(e){throw new Error("Photo illisible")}
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
  const S2=320, side=Math.min(img.naturalWidth,img.naturalHeight), cv=document.createElement('canvas'); cv.width=cv.height=S2;
  cv.getContext('2d').drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,S2,S2);
  URL.revokeObjectURL(src); return cv.toDataURL('image/jpeg',.82);
}

async function handleFiles(files){
  if(!files.length) return;
  const merge=$('#merge')?.checked;
  const imgs=files.filter(isImage);
  if(merge&&imgs.length>1){
    const others=files.filter(f=>!isImage(f));
    await processItem({name:`${imgs.length} photos`,getContent:async(p)=>{const all=[];let k=0;for(const f of imgs.slice(0,40)){p(`Préparation des photos… ${++k}/${Math.min(imgs.length,40)}`);all.push(...(await readFile(f)).images)}return {text:'',images:all}}});
    for(const f of others) await processItem({name:f.name,getContent:p=>readFile(f,p)});
  } else for(const f of files) await processItem({name:f.name,getContent:p=>readFile(f,p)});
}
const BATCH=5;
async function ocrMistral(images){
  const b64=await Promise.all(images.map(blobToB64));
  const j=await API.req('POST','/api/ocr',{images:b64});
  return j.pages.join('\n\n');
}
async function transcribeBatches(images,progress){
  const parts=[];
  if(ME&&ME.ocr){
    for(let i=0;i<images.length;i+=BATCH){
      const chunk=images.slice(i,i+BATCH);
      progress(`Lecture des pages ${i+1} à ${i+chunk.length} sur ${images.length}…`);
      parts.push(await ocrMistral(chunk));
    }
    return parts.join('\n\n');
  }
  for(let i=0;i<images.length;i+=BATCH){
    const chunk=images.slice(i,i+BATCH), a=i+1, b=i+chunk.length;
    progress(`L'IA lit les pages ${a} à ${b} sur ${images.length}…`);
    let txt;
    for(let tryN=0;tryN<2;tryN++){
      try{
        txt=await ask(`Voici les pages ${a} à ${b} (sur ${images.length}) d'un cours scanné ou photographié. ${studentCtx()}
Retranscris-les fidèlement et entièrement en Markdown propre (titres ##, listes, **mots importants**, tableaux en listes), dans l'ordre des pages. Corrige les erreurs de lecture évidentes mais n'invente, ne résume et ne commente rien. Si une page est vide ou illisible, écris simplement « [page illisible] ».
Réponds uniquement avec la transcription.`,{images:chunk,tier:'default'});
        break;
      }catch(e){ if(tryN||(e&&e.code==='not_granted')) throw e; await new Promise(r=>setTimeout(r,4000)); }
    }
    parts.push(txt.trim());
  }
  return parts.join('\n\n');
}
async function processItem({name,getContent}){
  const it={name,state:'work',msg:'Lecture du fichier…'}; S.queue.unshift(it); drawQueue();
  const progress=m=>{it.msg=m;drawQueue()};
  const forced=$('#forceMat')?.value||'';
  try{
    let ct=await getContent(progress);
    if(ct.images.length&&!S.imgOK) throw new Error("La lecture d'images par l'IA n'est pas disponible ici");
    if(ct.images.length>BATCH||(ct.images.length&&ME&&ME.ocr)){
      // Lecture complète, par paquets de pages
      ct={text:await transcribeBatches(ct.images,progress),images:[],transcribed:true};
    }
    progress(ct.images.length?`L'IA déchiffre ${ct.images.length>1?ct.images.length+' pages':'la page'}…`:'L\'IA range le cours…');
    const c=await analyseCourse({text:ct.text,images:ct.images,sourceName:name,forcedMatiere:forced,skipTranscript:ct.transcribed});
    await saveCourse(c);
    progress(`Rangé dans ${c.matiere} · création de la fiche de révision…`);
    try{c.fiche=await genFiche(c); await saveCourse(c);}catch(e){}
    publishSummary();
    it.state='ok'; it.courseId=c.id; it.msg=`Rangé dans ${c.matiere} · « ${c.titre} »${c.fiche?' · fiche prête 📝':''}`;
    renderSide();
  }catch(e){it.state='err'; it.msg=e&&e.code?aiErr(e):(e.message||String(e));}
  drawQueue();
}

function weakNotions(mat){
  const cnt={}; for(const r of S.results.filter(r=>r.matiere===mat).slice(-12)) for(const x of (r.rates||[])) cnt[x]=(cnt[x]||0)+1;
  for(const r of S.results.filter(r=>r.matiere===mat&&r.type==='note'&&r.score<.5&&Date.now()-r.date<60*DAY)) if(r.titre) cnt[r.titre]=(cnt[r.titre]||0)+2;
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
}

/* ---- Graphique ---- */
function lineChart(el,ser,color,h=180){
  const W=520,H=h,p={l:30,r:12,t:12,b:24};
  const xs=i=>p.l+(ser.length===1?0:i*(W-p.l-p.r)/(ser.length-1)), ys=v=>p.t+(100-v)*(H-p.t-p.b)/100;
  const path=ser.map((s,i)=>(i?'L':'M')+xs(i).toFixed(1)+','+ys(s.lvl).toFixed(1)).join('');
  const grid=[0,50,100].map(v=>`<line x1="${p.l}" x2="${W-p.r}" y1="${ys(v)}" y2="${ys(v)}" stroke="#ece7dc"/><text x="${p.l-6}" y="${ys(v)+4}" text-anchor="end" font-size="10" fill="#8d887d">${v}</text>`).join('');
  const lab=[0,ser.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${xs(i)}" y="${H-6}" text-anchor="${i?'end':'start'}" font-size="10" fill="#8d887d">${fmtDate(ser[i].date)}</text>`).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du niveau">${grid}${lab}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="xh" y1="${p.t}" y2="${H-p.b}" stroke="#bdb6a8" stroke-dasharray="3 3" opacity="0"/>
    <circle class="pt" r="5" fill="${color}" stroke="#fff" stroke-width="2" opacity="0"/>
    <circle cx="${xs(ser.length-1)}" cy="${ys(ser[ser.length-1].lvl)}" r="4.5" fill="${color}" stroke="#fff" stroke-width="2"/>
    <rect x="${p.l}" y="0" width="${W-p.l-p.r}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  const svg=$('svg',el),tip=$('.tip',el),xh=$('.xh',el),pt=$('.pt',el);
  $('.hit',el).onmousemove=e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(ser.length-1,Math.round((x-p.l)/((W-p.l-p.r)/Math.max(1,ser.length-1)))));
    const s=ser[i]; xh.setAttribute('x1',xs(i));xh.setAttribute('x2',xs(i));xh.setAttribute('opacity',1);
    pt.setAttribute('cx',xs(i));pt.setAttribute('cy',ys(s.lvl));pt.setAttribute('opacity',1);
    tip.innerHTML=`<b>${s.lvl}/100</b> · ${fmtDate(s.date)}<br>${({quiz:'Quiz',exo:'Exercices',devoir:'Devoir (IA)',note:'Note du prof'})[s.r.type]||'Niveau'} : ${Math.round(s.r.score*100)} %`;
    tip.style.left=(xs(i)*r.width/W)+'px'; tip.style.top=(ys(s.lvl)*r.height/H)+'px'; tip.style.opacity=1;
  };
  $('.hit',el).onmouseleave=()=>{tip.style.opacity=0;xh.setAttribute('opacity',0);pt.setAttribute('opacity',0)};
}

async function runQuiz(P,c,diff,n,chrono=false,onDone=null){

${courseCtx(c)}
Crée ${n} questions à choix multiples, difficulté « ${diff} », qui vérifient la compréhension (pas seulement le par-cœur), basées UNIQUEMENT sur ce cours${(c.texte||'').trim().length<50?" (si le cours est vide, appuie-toi sur les extraits du manuel et sur le programme officiel du BTS MCO)":''}.${c.focus?` TOUTES les questions doivent porter sur ce point faible de l'élève : « ${c.focus} ». Commence par des questions simples puis monte progressivement.`:''} Varie les notions.${weak.length?` Insiste un peu sur ces notions mal maîtrisées : ${weak.join(', ')}.`:''}
Chaque question a 4 propositions plausibles, une seule bonne. Mélange la position de la bonne réponse.
Réponds UNIQUEMENT avec ce JSON :
{"questions":[{"question":"","choix":["","","",""],"bonne":0,"explication":"pourquoi c'est la bonne réponse, 1-2 phrases","notion":"la notion testée en 2-4 mots"}]}`;
  let qs;
  try{qs=(await ask(prompt,{json:true,tier:'default'})).questions.filter(q=>q&&q.choix&&q.choix.length>=2)}catch(e){P.innerHTML=`<div class="banner">${esc(aiErr(e))}</div><button class="btn" id="rb">Réessayer</button>`;$('#rb').onclick=()=>pQuiz(P,c);return;}
  let i=0,good=0,combo=0,timer=null; const rates=[], LIM=20;
  const draw=()=>{
    const q=qs[i]; clearInterval(timer);
    P.innerHTML=`<div class="card qcard"><div class="row"><b>Question ${i+1} / ${qs.length}</b>${combo>=2?`<span class="combo">🔥 Combo x${combo}</span>`:''}<span class="sp"></span><span class="tag">${esc(q.notion||'')}</span></div>

      $('#fb').innerHTML=`<div class="explain ${ok?'good':'bad'}"><b>${cheer}</b> ${esc(q.explication||'')}</div><div class="row" style="margin-top:14px">${ok?'':`<button class="btn sm ghost" id="xq2">🤔 Explique autrement</button>`}<span class="sp"></span><button class="btn primary" id="nx">${i<qs.length-1?'Question suivante →':'Voir mon résultat'}</button></div>`;
      $('#nx').onclick=()=>{i++; i<qs.length?draw():finish()}; $('#nx').focus();

      <div class="row" style="justify-content:center;margin-top:16px">${onDone?`<button class="cta" id="cont" style="max-width:320px">Continuer ▶</button>`:`<button class="btn" id="again">↻ Nouveau quiz</button>${r.rates.length&&!c.virtual?`<button class="btn primary" id="expl">💬 M'expliquer ce que j'ai raté</button>`:''}`}</div></div>`;

  };
  draw();
}

/* ---------------- Planning de révision ---------------- */
const DAY=86400000;
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getTime()};
const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const fmtDay=t=>{const s=new Date(t).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1)};
const TASK={fiche:{i:'📝',min:15,l:c=>c&&c.fiche?'Relire la fiche':'Créer et apprendre la fiche'},quiz:{i:'🎯',min:10,l:()=>'Quiz'},exos:{i:'✏️',min:20,l:()=>'Exercices'},cartes:{i:'🃏',min:10,l:()=>'Cartes mémoire'},quizmat:{i:'🏁',min:15,l:()=>'Quiz général de la matière'}};

function edExams(){const own=S.planning.exams||[];return ((S.ed&&S.ed.controles)||[]).map(c=>({id:'ed_'+c.date+'_'+norm(c.matiere).replace(/[^a-z]/g,''),matiere:normMatiere(c.matiere),date:c.date,titre:'Contrôle',courses:[],ed:true,detail:c.titre})).filter((e,i,a)=>a.findIndex(x=>x.id===e.id)===i&&!own.some(o=>o.date===e.date&&o.matiere===e.matiere));}
function upcomingExams(){const t0=dayStart(Date.now());return [...(S.planning.exams||[]),...edExams()].filter(e=>parseKey(e.date)>=t0).sort((a,b)=>a.date.localeCompare(b.date));}
function edtMap(){const E=clone(S.planning.edt||{}); const cs=(S.ed&&S.ed.cours)||[]; if(cs.length){const by={}; for(const c of cs){if(c.annule)continue; const wd=new Date(parseKey(c.d)).getDay(); (by[wd]=by[wd]||new Set()).add(normMatiere(c.m));} for(const [d,set] of Object.entries(by)) E[d]=[...set].filter(n=>MATIERES.some(m=>m.n===n));} return E;}
function daysTo(e){return Math.round((parseKey(e.date)-dayStart(Date.now()))/DAY)}
function planSig(){const P=S.planning;return JSON.stringify([P.exams,P.minutes,P.repos,P.edt,S.ed&&S.ed.maj,S.courses.map(c=>c.id+c.matiere)])}

function buildPlan(fromT,days){
  const P=S.planning, budget=+P.minutes||30, exams=upcomingExams();
  const sim={},simType={};
  for(const r of [...S.results].sort((a,b)=>a.date-b.date)) if(r.courseId){sim[r.courseId]=r.date;simType[r.courseId]=r.type==='exo'?'exos':'quiz';}
  for(const k of Object.keys(P.done||{})){const [d,cid,ty]=k.split('|'); if(cid&&cid!=='*'&&parseKey(d)<fromT){sim[cid]=Math.max(sim[cid]||0,parseKey(d));}}
  const out=[];
  for(let k=0;k<days;k++){
    const t=fromT+k*DAY, key=dkey(t);
    const day={key,t,tasks:[],exams:exams.filter(e=>e.date===key),rest:(P.repos||[]).includes(new Date(t).getDay())};
    out.push(day);
    if(day.rest||!S.courses.length) continue;
    let left=budget;
    for(const e of exams) if(parseKey(e.date)-t===DAY&&S.courses.some(c=>c.matiere===e.matiere)){day.tasks.push({type:'quizmat',matiere:e.matiere,min:15,why:'Examen demain'});left-=15;}
    const cands=S.courses.map(c=>{
      const lvl=levelOf(c.matiere);
      const ex=exams.find(e=>e.matiere===c.matiere&&parseKey(e.date)>t&&(!e.courses||!e.courses.length||e.courses.includes(c.id)));
      const dleft=ex?Math.round((parseKey(ex.date)-t)/DAY):null;
      const wEx=dleft==null?1:dleft<=3?3.2:dleft<=7?2.2:dleft<=14?1.5:1.1;
      const wLvl=1.5-(lvl==null?50:lvl)/100, edtTom=(edtMap()[(new Date(t).getDay()+1)%7]||[]).includes(c.matiere);
      const interval=lvl==null||lvl<50?2:lvl<75?4:7;
      const since=sim[c.id]?(t-dayStart(sim[c.id]))/DAY:interval*1.5;
      return {c,lvl,ex,dleft,score:wEx*wLvl*(edtTom?1.4:1)*Math.min(2.5,Math.max(.15,since/interval)),edtTom};
    }).sort((a,b)=>b.score-a.score);
    for(const x of cands){
      if(left<10) break;
      if(x.score<.4&&day.tasks.length) break;
      const c=x.c, last=simType[c.id];
      let type=!c.fiche&&!last?'fiche':last==='fiche'?'quiz':last==='quiz'?((x.lvl??0)>=60?'exos':(c.fiche?'cartes':'exos')):'quiz';
      if(TASK[type].min>left) type='quiz';
      if(TASK[type].min>left) break;
      day.tasks.push({type,courseId:c.id,matiere:c.matiere,min:TASK[type].min,why:x.ex?(x.dleft<=1?'Examen demain':`Examen dans ${x.dleft} j`):x.edtTom?'Cours demain':(x.lvl!=null&&x.lvl<50?'Notion fragile':'Révision espacée')});
      sim[c.id]=t; simType[c.id]=type; left-=TASK[type].min;
    }
  }
  return out;
}
function todayPlan(){
  const P=S.planning, key=dkey(Date.now()), sig=planSig();
  if(!P.today||P.today.key!==key||P.today.sig!==sig){
    P.today={key,sig,tasks:buildPlan(dayStart(Date.now()),1)[0].tasks};
    savePlanning().catch(()=>{});
  }
  return P.today.tasks.filter(t=>t.type==='quizmat'||S.courses.some(c=>c.id===t.courseId));
}
const taskKey=(day,t)=>`${day}|${t.courseId||'*'}|${t.type}|${t.matiere}`;
function isDone(day,t){
  if((S.planning.done||{})[taskKey(day,t)]) return true;
  const t0=parseKey(day),t1=t0+DAY;
  return S.results.some(r=>r.date>=t0&&r.date<t1&&(t.type==='cartes'?(r.type==='cartes'&&(r.courseIds||[r.courseId]).includes(t.courseId)):t.type==='quizmat'?(!r.courseId&&r.matiere===t.matiere&&r.type==='quiz'):r.courseId===t.courseId&&((t.type==='quiz'&&r.type==='quiz')||(t.type==='exos'&&r.type==='exo'))));
}
function taskRow(day,t,interactive=true){
  const c=S.courses.find(x=>x.id===t.courseId), info=matInfo(t.matiere), done=isDone(day,t), T=TASK[t.type];
  const start=esc(JSON.stringify({type:t.type,courseId:t.courseId||null,matiere:t.matiere}));
  return `<div class="task ${done?'done':''}" style="--c:${info.c}">
    <span class="tico">${done?'✓':T.i}</span>
    <div class="sp"><div class="tt">${t.type==='quizmat'?esc(t.matiere):esc(c?c.titre:'')}</div><div class="td">${T.l(c)} · ${t.min} min</div></div>
    ${interactive?(done?`<button class="chk" data-chk="${esc(taskKey(day,t))}" aria-label="Annuler">↺</button>`:`<button class="go" data-start='${start}' aria-label="Commencer">▶</button>`):''}</div>`;
}
function bindTasks(root,day){
  root.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>go('devoir',b.dataset.dev));
  root.querySelectorAll('[data-chk]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.chk; S.planning.done=S.planning.done||{};
    const was=S.planning.done[k]; if(was) delete S.planning.done[k]; else {S.planning.done[k]=true; sndGood();}
    render(); await savePlanning().catch(()=>{});
    if(!was){const d=dkey(Date.now()),t=todayPlan(); if(t.length&&t.every(x=>isDone(d,x))){confetti();sndWin();toast("🎉 Programme du jour terminé, bravo !")}}
  });
  root.querySelectorAll('[data-start]').forEach(b=>b.onclick=async()=>{
    const t=JSON.parse(b.dataset.start);
    if(t.type==='quizmat'){S.subjectQuiz=t.matiere;return go('course','__subject__','quiz');}
    if(t.type==='cartes') return go('course',t.courseId,'cartes');
    if(t.type==='fiche'){
      S.ficheMode='fiche';
      S.planning.done=S.planning.done||{}; S.planning.done[taskKey(day,t)]=true; savePlanning().catch(()=>{});
      return go('course',t.courseId,'fiche');
    }
    go('course',t.courseId,t.type);
  });
}
function todayCard(compact){
  const day=dkey(Date.now()), tasks=todayPlan(), done=tasks.filter(t=>isDone(day,t)).length;

    ${dueSoon().map(d=>`<div class="duerow" data-dev="${d.id}">✏️ <b class="sp">${esc(d.titre)}</b>${dueLabel(d)}</div>`).join('')}

}
function vPlanning(M){
  const P=S.planning, exams=upcomingExams(), next=buildPlan(dayStart(Date.now()),8).slice(1);
  M.innerHTML=`${banner()}

let sumTimer=null, sumBusy=false, sumAgain=false;
function buildSummary(){
  const subs=subjects();
  const now=dayStart(Date.now());
  const dv=S.devoirs||[];
  return {
    prenom:S.profile.prenom||'', niveau:S.profile.niveau||'', photo:S.profile.photo||'', maj:Date.now(),
    matieres:subs.map(s=>({n:s.n,lvl:s.lvl,moy:(subjScore(s.n)||{}).v??null,moyLab:(subjScore(s.n)||{}).lab||'',cours:s.count,fiches:S.courses.filter(c=>c.matiere===s.n&&c.fiche).length,last:s.last||0,serie:levelSeries(s.n).slice(-12).map(p=>({d:p.date,l:p.lvl})),fragiles:weakNotions(s.n).slice(0,5)})),
    devoirs:{aFaire:dv.filter(d=>d.statut==='a_faire').length,retard:dv.filter(d=>d.statut==='a_faire'&&d.pour&&parseKey(d.pour)<now).length,
      liste:dv.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,12).map(d=>({titre:d.titre,matiere:d.matiere,pour:d.pour||'',statut:d.statut,noteIA:d.correction&&d.correction.note!=null?d.correction.note:null,noteProf:d.noteProf??null}))},
    derniers:[...S.results].sort((a,b)=>b.date-a.date).slice(0,12).map(r=>({type:r.type,matiere:r.matiere,titre:r.titre||'',score:r.score,date:r.date})),
    semaine:S.results.filter(r=>r.type!=='note'&&Date.now()-r.date<7*DAY).length,
    ...(()=>{const st=streakInfo(),L=levelInfo();return {serie:st.streak,serieAuj:st.today,record:st.best,xp:L.xp,lvl:L.lvl,titre:L.titre,badges:(S.profile.badges||[]).length,progress:{serie:st.best,niveau:L.lvl,quiz:S.results.filter(r=>r.type==='quiz'&&r.score>=.7).length,points:L.xp,defis:defisDoneCount(),notes:RTYPES.notes.v(),cartes:RTYPES.cartes.v()}}})(),
    ...(()=>{const w=Date.now()-7*DAY,ad=[...activityDays()].filter(d=>parseKey(d)>=dayStart(w)+DAY).length;return {jours7:ad,cartes7:S.results.filter(r=>r.type==='cartes'&&r.date>=w).reduce((a,r)=>a+(r.total||0),0),defis7:weekDefis().filter(d=>d.ok).length,examens:upcomingExams().slice(0,3).map(e=>({titre:e.titre||'Examen',matiere:e.matiere,date:e.date}))}})()
  };
}
function publishSummary(){
  if(S.mode!=='cloud') return;
  clearTimeout(sumTimer);
  sumTimer=setTimeout(async()=>{
    if(sumBusy){sumAgain=true;return}
    sumBusy=true;
    try{await S.db.doc('suivi/'+S.uid).set(buildSummary())}catch(e){}
    sumBusy=false; if(sumAgain){sumAgain=false;publishSummary()}
  },1500);
}

async function saveDevoir(d){const i=S.devoirs.findIndex(x=>x.id===d.id); if(i>=0)S.devoirs[i]=d; else S.devoirs.unshift(d); await saveDoc(d.id,d); publishSummary();}
function dueLabel(d){
  if(!d.pour) return '';
  const n=Math.round((parseKey(d.pour)-dayStart(Date.now()))/DAY);
  if(d.statut!=='a_faire') return `pour le ${fmtDate(parseKey(d.pour))}`;
  if(n<0) return `<span style="color:var(--bad);font-weight:700">en retard de ${-n} j</span>`;
  if(n===0) return `<span style="color:var(--warn);font-weight:700">pour aujourd'hui</span>`;
  if(n===1) return `<span style="color:var(--warn);font-weight:700">pour demain</span>`;
  return `pour ${new Date(parseKey(d.pour)).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'})}`;
}

async function filesToText(files,progress){
  let text='',images=[];
  for(const f of files){const r=await readFile(f,progress); text+=(r.text||'')+'\n'; images.push(...r.images);}
  if(images.length){
    if(!S.imgOK&&!(ME&&ME.ocr)) throw new Error("La lecture d'images par l'IA n'est pas disponible ici");
    text+=await transcribeBatches(images,progress);
  }

}

function tone(seq){
  const A=ac(); if(!A) return;
  try{const t0=A.currentTime+.01;
    seq.forEach(([f,d,at,type='sine',vol=.18,f2])=>{const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t0+at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+at+d);
      g.gain.setValueAtTime(.0001,t0+at);g.gain.exponentialRampToValueAtTime(vol,t0+at+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+at+d);o.connect(g).connect(A.destination);o.start(t0+at);o.stop(t0+at+d+.05);});
  }catch(e){}
}

  const s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=n;f.type='highpass';f.frequency.value=hp;g.gain.value=vol;s.connect(f).connect(g).connect(A.destination);s.start(A.currentTime+.01+at);}catch(e){}}

function confetti(n=140){
  const cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);
  const ctx=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight,C=['#f2762e','#ffe14d','#1e2a4a','#1baf7a','#e87ba4','#2a78d6'];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:pick(C),a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function step(){ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();}

}

/* ---- Points, niveau, série ---- */
function activityDays(){
  const s=new Set();
  for(const r of S.results) if(r.type!=='note') s.add(dkey(r.date)); else if(r.analyse&&r.analyse.date) s.add(dkey(r.analyse.date));
  for(const k of Object.keys(S.planning.done||{})) s.add(k.split('|')[0]);
  for(const c of S.courses) if(c.createdAt) s.add(dkey(c.createdAt));
  return s;
}
function streakInfo(){
  const s=activityDays(); let t=dayStart(Date.now()); const today=s.has(dkey(t));
  if(!today) t-=DAY; let n=0; while(s.has(dkey(t))){n++;t-=DAY}
  const days=[...s].sort(); let best=0,run=0,prev=null;
  for(const d of days){const t2=parseKey(d); run=prev!=null&&Math.round((t2-prev)/DAY)===1?run+1:1; best=Math.max(best,run); prev=t2;}
  return {streak:n,today,best:Math.max(best,n)};
}
function xpTotal(){
  let x=0;
  for(const r of S.results){ x+= r.type==='quiz'?10+Math.round(r.score*10)+(r.chrono?5:0) : r.type==='exo'?15+Math.round(r.score*10) : r.type==='devoir'?20 : r.type==='note'?(r.source==='ed'?(r.analyse?20:0):10+(r.score>=.75?10:0)) : r.type==='cartes'?5+Math.min(10,Math.round((r.total||0)/2)) : r.type==='oral'?20+Math.round(r.score*10) : 5; }
  x+=S.courses.length*10 + S.courses.filter(c=>c.fiche).length*3 + Object.keys(S.planning.done||{}).length*5 + (S.profile.defisDone||[]).length*30;
  return x;
}
const TITRES=['Renardeau','Petite crapule','Crapule maligne','Crapule rusée','Crapule futée','Grande crapule','Crapule d\'élite','Maître crapule','Crapule légendaire'];
function levelInfo(xp=xpTotal()){let lvl=1,acc=0,need=100;while(xp>=acc+need){acc+=need;lvl++;need=Math.round(need*1.2)}return {lvl,xp,into:xp-acc,need,titre:TITRES[Math.min(lvl-1,TITRES.length-1)]};}
function xpChip(){const L=levelInfo(),st=streakInfo();return `<div class="xpchip" data-go2="trophees" title="Mes trophées"><span class="flame ${st.today?'':'off'}">🔥 ${st.streak}</span><span class="lv">Niv. ${L.lvl}</span><span class="xpbar"><i style="width:${Math.round(L.into/L.need*100)}%"></i></span></div>`;}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function dictate(input,btn){
  if(!SR) return toast("La dictée n'est pas disponible sur ce navigateur");
  const r=new SR(); r.lang='fr-FR'; r.interimResults=true; r.continuous=false;
  const base=input.value?input.value+' ':''; btn.classList.add('rec');
  r.onresult=e=>{let t='';for(const x of e.results) t+=x[0].transcript; input.value=base+t;};
  r.onend=()=>btn.classList.remove('rec'); r.onerror=()=>{btn.classList.remove('rec');toast("Micro indisponible : autorise-le dans le navigateur")};
  try{r.start()}catch(e){btn.classList.remove('rec')}
}
const plain=t=>String(t||'').replace(/[#*`>_]/g,'').replace(/\n+/g,'. ').replace(/\s+/g,' ');
let speaking=null;
function speak(text,btn){
  if(!('speechSynthesis' in window)) return toast('Lecture à voix haute indisponible ici');
  speechSynthesis.cancel(); document.querySelectorAll('.speak.on').forEach(b=>b.classList.remove('on'));
  if(speaking===btn){speaking=null;return}
  const u=new SpeechSynthesisUtterance(plain(text)); u.lang='fr-FR'; u.rate=1.02;
  const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang)); if(v) u.voice=v;
  u.onend=()=>{btn&&btn.classList.remove('on');speaking=null}; speaking=btn; btn&&btn.classList.add('on'); speechSynthesis.speak(u);
}
const speakBtn=id=>`<button class="speak" data-speak="${id}" title="Écouter">🔊</button>`;

const b64uToU8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};

  const reg=await navigator.serviceWorker.getRegistration(); const sub=reg&&await reg.pushManager.getSubscription();
  return sub?'on':Notification.permission==='denied'?'denied':'off';

const STOP=new Set('les des une un le la de du et en à au aux pour par sur dans avec est sont qui que quoi dont où ce cet cette ces son sa ses leur leurs nous vous ils elles il elle on ne pas plus moins être avoir fait faire peut doit entre comme mais ou donc car ainsi aussi tout tous toute toutes très bien leurs lors après avant chez sans sous vers été cela celui celle ceux elles être était sera soit fois deux trois page chapitre partie exemple exemples selon également notamment afin alors quand comment pourquoi lorsque'.split(' '));
const tokens=t=>norm(t).match(/[a-z0-9]{4,}/g)?.filter(w=>!STOP.has(w))||[];
function keywords(text,n=80){const f={};for(const w of tokens(text)) f[w]=(f[w]||0)+1;return Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([w,c])=>[w,c]);}
function chunkText(text,size=12000){
  const out=[]; let i=0; text=String(text||'').replace(/\n{3,}/g,'\n\n');
  while(i<text.length){let j=Math.min(text.length,i+size); if(j<text.length){const k=text.lastIndexOf('\n\n',j); if(k>i+size*.6) j=k;} out.push(text.slice(i,j).trim()); i=j;}
  return out.filter(Boolean);
}
const chunkTitle=t=>{const l=t.split('\n').map(x=>x.replace(/^#+\s*/,'').trim()).find(x=>x.length>3&&x.length<90);return l||t.slice(0,60)};
S.books=[]; const chunkCache=new Map();
async function loadBooks(){try{const j=await API.req('GET','/api/lib'); S.books=j.items.map(x=>x.data).sort((a,b)=>a.createdAt-b.createdAt);}catch(e){S.books=[]} try{const j=await API.req('GET','/api/jobs');S.jobs=j.items||{};S.jobsErr=j.lastErr;S.jobsRun=j.lastRun;}catch(e){S.jobs={}} if(Object.values(S.jobs||{}).some(x=>x.wait)) pumpJobs();}
/* fait avancer la lecture des livres tant que l'appli est ouverte (en plus de la tâche planifiée du serveur) */
let pumping=false;
async function pumpJobs(){
  if(pumping) return; pumping=true;
  try{
    for(let k=0;k<200;k++){
      if(document.visibilityState!=='visible'){await sleep(3000);continue;}
      const r=await API.req('POST','/api/jobs/run',{}).catch(e=>({ok:false,err:e.message}));
      const j=await API.req('GET','/api/jobs').catch(()=>null); if(!j) break;
      S.jobs=j.items||{}; S.jobsErr=j.lastErr;
      const pending=Object.values(S.jobs).some(x=>x.wait);
      if(['subject','cours'].includes(S.view)&&!document.querySelector('.modal-bg')){ if(!pending){const l=await API.req('GET','/api/lib').catch(()=>null); if(l) S.books=l.items.map(x=>x.data).sort((a,b)=>a.createdAt-b.createdAt);} render(); }
      if(!pending) break;
      await sleep(r&&r.ok?800:6000);
    }
  }finally{pumping=false}
}
const booksOf=m=>S.books.filter(b=>b.matiere===m);
async function getChunk(bookId,n){const k=bookId+'_'+n; if(chunkCache.has(k)) return chunkCache.get(k); const r=await API.req('GET','/api/lib/'+encodeURIComponent('bkc_'+k)); chunkCache.set(k,r.t||''); return r.t||'';}
async function refExcerpts(matiere,query,max=30000){
  const books=booksOf(matiere); if(!books.length) return '';
  const q=new Set(tokens(query)); if(!q.size) return '';
  const scored=[];
  for(const b of books) for(const c of b.chunks||[]){let s=0; for(const [w,n] of c.kw) if(q.has(w)) s+=Math.min(n,6); if(s>0) scored.push({b,c,s});}
  scored.sort((a,b)=>b.s-a.s);
  let out='',used=0;
  for(const x of scored.slice(0,4)){ if(used>=max) break;
    let t; try{t=await getChunk(x.b.key,x.c.n)}catch(e){continue}
    t=t.slice(0,Math.min(12000,max-used)); used+=t.length;
    out+=`\n--- Extrait de « ${x.b.titre} »${x.c.p?` (vers la page ${x.c.p})`:''} ---\n${t}\n`;
  }
  return out?`\nMANUEL(S) DE RÉFÉRENCE DE LA MATIÈRE — extraits pertinents :\n"""${out}"""\nAppuie-toi en priorité sur ces ouvrages de référence : reprends leur vocabulaire, leurs définitions et leurs méthodes, et n'invente rien qui les contredise.\n`:'';
}
async function attachRefs(o,extra=''){
  try{o._refs=await refExcerpts(o.matiere,[o.titre,o.chapitre,(o.notions||[]).join(' '),o.consigne,(o.enonce||'').slice(0,3000),(o.texte||'').slice(0,4000),(o.copie||'').slice(0,2000),extra].filter(Boolean).join(' '));}catch(e){o._refs='';}
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitVisibleOnline(){

}
async function withRetry(fn,progress,label){
  for(let k=1;;k++){
    try{ await waitVisibleOnline(); return await fn(); }
    catch(e){
      if(e&&['bad_key','no_ocr','no_key','no_credit','invalid_request','forbidden','unauthenticated','session_expired'].includes(e.code)) throw e;
      if(k>=6) throw e;
      progress(`${label} — connexion perdue, nouvel essai (${k}/5)…`);
      await sleep(3000*k);

  }
}

async function importBook({files,titre,matiere,book,progress,confirmScan}){
  // livre existant (ajout de pages ou reprise) ou nouveau
  const isNew=!book;
  if(isNew) book={key:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),titre,matiere,chunks:[],chars:0,pages:0,createdAt:Date.now(),par:S.profile.prenom||''};
  const resume=book.enCours&&book.enCours.total===files.length?book.enCours.done:0;
  const prev=resume?book.enCours:{};
  book.enCours={total:files.length,done:resume};
  let buf=prev.buf||'', bufPage=prev.bufPage??null, page=book.pages||0;
  const saveIndex=async()=>{ if(book.enCours){ book.enCours.buf=buf; book.enCours.bufPage=bufPage; } await withRetry(()=>API.req('PUT','/api/lib/'+encodeURIComponent('book_'+book.key),book),progress,'Enregistrement'); };
  const saveChunk=async(force)=>{
    while(buf.length>=12000||(force&&buf.trim())){
      let cut=Math.min(buf.length,12000);
      if(buf.length>12000){ const k=buf.lastIndexOf('\n\n',cut); if(k>7000) cut=k; }
      const t=buf.slice(0,cut).trim(); buf=buf.slice(cut);
      if(t){ const n=book.chunks.length;
        await withRetry(()=>API.req('PUT','/api/lib/'+encodeURIComponent(`bkc_${book.key}_${n}`),{t}),progress,'Enregistrement');
        book.chunks.push({n,titre:chunkTitle(t),p:bufPage,kw:keywords(t,70)}); book.chars+=t.length; }
      bufPage=page;
      if(!buf.trim()) { buf=''; break; }
    }
  };
  const addText=async(t,p)=>{ if(bufPage==null) bufPage=p; buf+=t+'\n\n'; if(buf.length>=12000) await saveChunk(false); };
  const ocr=async(blobs,label)=>withRetry(()=>transcribeBatches(blobs,()=>{}),progress,label);
  if(isNew) await saveIndex();
  if(resume) progress(`Reprise à la photo ${resume+1} / ${files.length}…`);
  let pending=[], pendingFrom=0;
  const flush=async()=>{ if(!pending.length) return; const lbl=`Lecture des pages ${pendingFrom} à ${pendingFrom+pending.length-1}`;
    progress(lbl+(files.length>1?` (photo ${Math.min(book.enCours.done+pending.length,files.length)} / ${files.length})`:'')+'…');
    const t=await ocr(pending,lbl); await addText(t,pendingFrom);
    book.enCours.done+=pending.length; pending=[]; book.pages=page;
    await saveIndex(); };
  for(let i=resume;i<files.length;i++){
    const f=files[i], name=f.name.toLowerCase();
    if(name.endsWith('.pdf')){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise, N=Math.min(pdf.numPages,800);
      let asked=false, pp=[], ppFrom=0;
      const fl=async()=>{ if(!pp.length) return; const lbl=`Lecture des pages ${ppFrom} à ${ppFrom+pp.length-1} / ${N}`; progress(lbl+'…'); await addText(await ocr(pp,lbl),ppFrom); pp=[]; };
      for(let p=1;p<=N;p++){
        if(p%10===1) progress(`Lecture du livre… page ${p} / ${N}`);
        const pg=await pdf.getPage(p), tc=await pg.getTextContent();
        const txt=tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join(''); page=(book.pages||0)+p;
        if(txt.replace(/\s/g,'').length>80){ await fl(); await addText(txt,page); continue; }
        if(!asked&&N>20){ asked=true; if(!(await confirmScan(N))) throw new Error('Import annulé'); }
        if(!S.imgOK&&!(ME&&ME.ocr)) throw new Error("La lecture des pages scannées n'est pas disponible");
        const vp=pg.getViewport({scale:1.5}), cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
        await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        if(!pp.length) ppFrom=page; pp.push(await imageToBlob(cv.toDataURL('image/jpeg',.88)));
        if(pp.length>=BATCH) await fl();
      }
      await fl(); book.pages=page; book.enCours.done=i+1; await saveIndex();
    } else if(isImage(f)){
      if(i===resume&&isNew&&files.length>20&&!resume&&!(await confirmScan(files.length))) throw new Error('Import annulé');
      page++; if(!pending.length) pendingFrom=page;
      pending.push(...(await readFile(f)).images);
      if(pending.length>=BATCH) await flush();
    } else { await flush(); const r=await readFile(f,progress); await addText(r.text,null); book.enCours.done=i+1; }
  }
  await flush();
  book.pages=Math.max(book.pages||0,page);
  await saveChunk(true);
  delete book.enCours;
  await saveIndex();
  const k=S.books.findIndex(x=>x.key===book.key); if(k>=0) S.books[k]=book; else S.books.push(book);
  return book;
}
/* Envoi des photos au serveur : la lecture continue même appli fermée */
async function serverImport({files,titre,matiere,book,progress}){
  const isNew=!book;
  if(isNew){ book={key:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),titre,matiere,chunks:[],chars:0,pages:0,createdAt:Date.now(),par:S.profile.prenom||''};
    await withRetry(()=>API.req('PUT','/api/lib/'+encodeURIComponent('book_'+book.key),book),progress,'Création du livre'); }
  let base=book.pages||0;
  try{const j=await API.req('GET','/api/jobs'); const st=j.items[book.key]; if(st) base=Math.max(base,st.maxN||0);}catch(e){}
  for(let i=0;i<files.length;i++){
    progress(`Envoi de la photo ${i+1} / ${files.length}`);
    const blobs=(await readFile(files[i])).images||[];
    for(const bl of blobs){
      const u=URL.createObjectURL(bl); let img=await blobToB64(await imageToBlob(u,1700)); if(img.length>1800000) img=await blobToB64(await imageToBlob(u,1300)); URL.revokeObjectURL(u);
      base++; const n=base;
      await withRetry(()=>API.req('POST','/api/jobs',{book:book.key,n,img}),progress,`Envoi de la photo ${i+1}`);
    }
  }
  return {book,count:files.length};
}

const BOX_D=[0,1,3,7,21,45];
function liveCards(){
  const by=new Map(S.courses.map(c=>[c.id,c]));
  return (S.cards||[]).filter(k=>{const c=by.get(k.courseId); if(c) k.matiere=c.matiere; return !!c;});
}
function dueCards(mat,courseId){
  const end=dayStart(Date.now())+DAY;
  return liveCards().filter(k=>(!mat||k.matiere===mat)&&(!courseId||k.courseId===courseId)&&(k.due||0)<end)
    .sort((a,b)=>(b.box?1:0)-(a.box?1:0)||(a.due||0)-(b.due||0));
}
let cardsTimer=null;
function saveCards(){clearTimeout(cardsTimer);cardsTimer=setTimeout(()=>saveDoc('cartes',{items:S.cards||[]}).catch(()=>{}),700);}
function rateCard(k,ok){
  const now=Date.now(); k.n=(k.n||0)+1; k.last=now;
  if(ok){k.box=Math.min(5,(k.box||0)+1);k.ok=(k.ok||0)+1;} else {k.box=1;k.ko=(k.ko||0)+1;}
  k.due=dayStart(now)+BOX_D[k.box]*DAY; saveCards();
}
function cardsFromFiche(f){
  return [...(f.definitions||[]).map(d=>({q:`Définis : ${d.terme}`,a:d.definition})),...(f.formules||[]).map(x=>({q:`Formule : ${x.nom} ?`,a:x.expression})),...(f.points_cles||[]).slice(0,6).map(p=>({q:'Complète : '+String(p).split(' ').slice(0,6).join(' ')+'…',a:p}))];
}
async function makeCards(c){
  if(liveCards().some(k=>k.courseId===c.id)) return;
  let items=[];
  try{
    await attachRefs(c);
    const r=await ask(`Tu es un professeur qui prépare des cartes mémoire (flashcards) pour un élève de BTS MCO. ${studentCtx()} ${STYLE_RULES}
${courseCtx(c,20000)}
Crée 12 cartes question/réponse qui couvrent les notions importantes de CE cours (définitions, distinctions, conditions, chiffres, méthodes). Questions courtes et précises. Réponses de 25 mots maximum, faciles à vérifier de tête.
Réponds UNIQUEMENT avec ce JSON : {"cartes":[{"q":"","r":""}]}`,{json:true,tier:'quick'});
    items=(r.cartes||[]).filter(x=>x&&x.q&&x.r).slice(0,15).map(x=>({q:x.q,a:x.r}));
  }catch(e){ if(!c.fiche) throw e; }

/* Paquet de cartes à glisser : droite = je sais, gauche = pas su */
function cardDeck(el,deck,{onEnd,label=''}={}){
  const queue=deck.slice(), seen=new Set(); let known=0, total=0, flipped=false;
  const fin=async()=>{
    if(total){const mats={};deck.forEach(k=>mats[k.matiere]=(mats[k.matiere]||0)+1);const mat=Object.entries(mats).sort((a,b)=>b[1]-a[1])[0][0];
      const ids=[...new Set(deck.map(k=>k.courseId))];
      try{await saveResult({id:uid('r'),type:'cartes',courseId:ids.length===1?ids[0]:null,courseIds:ids,matiere:mat,score:known/total,total,bons:known,date:Date.now()})}catch(e){}}
    onEnd&&onEnd({known,total});
  };
  const draw=()=>{
    const k=queue[0]; if(!k) return fin(); flipped=false;
    const left=queue.length, c=S.courses.find(x=>x.id===k.courseId), info=matInfo(k.matiere);
    el.innerHTML=`<div class="deck">
      <div class="row deck-top"><span class="tag" style="background:${info.c}22">${info.e} ${esc(c?c.titre:k.matiere)}</span><span class="sp"></span><b>${left}</b><span class="muted">&nbsp;carte${left>1?'s':''}</span></div>
      <div class="swc" id="swc"><div class="swin"><div class="swf">${esc(k.q)}<small>Touche pour voir la réponse</small></div><div class="swb">${esc(k.a)}</div></div>
        <span class="stamp no">PAS SU</span><span class="stamp yes">JE SAIS</span></div>
      <div class="swbtns"><button class="swno" id="swN" aria-label="Pas su">✗</button><button class="swflip" id="swF">↻</button><button class="swyes" id="swY" aria-label="Je sais">✓</button></div>
      <div class="muted deck-help">Glisse à droite si tu savais, à gauche sinon</div></div>`;
    const card=$('#swc',el); let x0=null,dx=0,moved=false;
    const flip=()=>{flipped=!flipped;card.classList.toggle('flip',flipped);SFX.flip()};
    const decide=ok=>{
      card.style.transition='transform .3s, opacity .3s'; card.style.transform=`translateX(${ok?520:-520}px) rotate(${ok?18:-18}deg)`; card.style.opacity=0;
      const kk=queue.shift(); total+=seen.has(kk.id)?0:1; if(ok&&!seen.has(kk.id)) known++;
      rateCard(kk,ok); ok?SFX.swipeYes():SFX.swipeNo();
      if(!ok&&!seen.has(kk.id)) queue.push(kk); seen.add(kk.id);
      setTimeout(draw,260);
    };
    card.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;moved=false;card.setPointerCapture(e.pointerId);card.style.transition='none'});
    card.addEventListener('pointermove',e=>{if(x0==null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;card.classList.toggle('to-yes',dx>50);card.classList.toggle('to-no',dx<-50)});
    const up=()=>{if(x0==null)return;x0=null;card.classList.remove('to-yes','to-no');if(Math.abs(dx)>90)return decide(dx>0);card.style.transition='transform .25s';card.style.transform='';if(!moved)flip()};
    card.addEventListener('pointerup',up); card.addEventListener('pointercancel',up);
    $('#swF',el).onclick=flip; $('#swY',el).onclick=()=>decide(true); $('#swN',el).onclick=()=>decide(false);
  };
  draw();
}

function sessionPlan(){
  const day=dkey(Date.now()), tasks=S.courses.length?todayPlan():[];
  const qt=tasks.find(t=>!isDone(day,t)&&(t.type==='quiz'||t.type==='exos'||t.type==='quizmat'));
  let course=qt&&qt.courseId?S.courses.find(c=>c.id===qt.courseId):null;
  if(!course&&qt&&qt.type==='quizmat') course={virtualMat:qt.matiere};
  if(!course){const cs=[...S.courses].sort((a,b)=>(levelOf(a.matiere)??50)-(levelOf(b.matiere)??50)||(a.lastQuiz||0)-(b.lastQuiz||0)); course=cs[0]||null;}
  const due=dueCards().slice(0,20);
  const steps=[];
  if(due.length) steps.push({k:'cartes',i:'🃏',t:'Cartes',min:Math.max(2,Math.round(due.length/3)),due});
  else if(course&&!course.virtualMat) steps.push({k:'newcartes',i:'🃏',t:'Cartes',min:4,course});
  if(course) steps.push({k:'quiz',i:'🎯',t:'Quiz express',min:5,course});
  return steps;
}

let pod=null;
function podcastScript(c){
  const f=c.fiche; const parts=[`Fiche : ${c.titre}.`];

    if((f.points_cles||[]).length) parts.push('À retenir. '+f.points_cles.join('. '));
    if((f.definitions||[]).length) parts.push('Définitions. '+f.definitions.map(d=>d.terme+' : '+d.definition).join('. '));
    if((f.formules||[]).length) parts.push('Formules. '+f.formules.map(x=>x.nom+' : '+x.expression).join('. '));

}

/* ================= Bilan de la semaine (parent) ================= */
function weekBilan(u){
  const now=Date.now(), wk=now-7*DAY, out=[];
  for(const m of u.matieres||[]){
    const s=(m.serie||[]); if(!s.length) continue;
    const before=[...s].reverse().find(p=>p.d<wk), cur=s[s.length-1].l;
    if(before&&cur!==before.l) out.push({n:m.n,d:cur-before.l,cur}); else if(!before&&s.some(p=>p.d>=wk)) out.push({n:m.n,d:null,cur});
  }
  return out;
}
function bilanCard(u){
  const ms=weekBilan(u), up=ms.filter(m=>m.d>0).sort((a,b)=>b.d-a.d), down=ms.filter(m=>m.d<0).sort((a,b)=>a.d-b.d);
  const weak=(u.matieres||[]).filter(m=>m.moy!=null||m.lvl!=null).sort((a,b)=>(a.moy??a.lvl/5)-(b.moy??b.lvl/5))[0];
  return `<div class="bilan"><h3 style="margin:0 0 10px">📊 Sa semaine</h3>
    <div class="bstats"><div><b>${u.jours7??'—'}</b><small>jours actifs / 7</small></div><div><b>${u.semaine||0}</b><small>entraînements</small></div><div><b>${u.cartes7||0}</b><small>cartes revues</small></div><div><b>${u.defis7??0}/3</b><small>défis réussis</small></div></div>
    ${up.length?`<div class="bl">📈 En progrès : ${up.slice(0,3).map(m=>`<b>${esc(m.n)}</b> +${String(Math.round(m.d/5*10)/10).replace('.',',')} pt`).join(', ')}</div>`:''}
    ${down.length?`<div class="bl">📉 En baisse : ${down.slice(0,3).map(m=>`<b>${esc(m.n)}</b> ${String(Math.round(m.d/5*10)/10).replace('.',',')} pt`).join(', ')}</div>`:''}
    ${weak?`<div class="bl">🎯 À encourager : <b>${esc(weak.n)}</b> (${String(Math.round((weak.moy!=null?weak.moy:weak.lvl/5)*10)/10).replace('.',',')}/20)</div>`:''}
    ${u.devoirs&&u.devoirs.retard?`<div class="bl">⚠️ ${u.devoirs.retard} devoir${u.devoirs.retard>1?'s':''} en retard</div>`:''}
    ${(u.examens||[]).length?`<div class="bl">📅 Prochain examen : <b>${esc(u.examens[0].titre)}</b> (${esc(u.examens[0].matiere)}) le ${fmtDate(parseKey(u.examens[0].date))}</div>`:''}
  </div>`;
}

/* ================= Ta journée ================= */
function dayCard(){
  const h=new Date().getHours(), E=edtMap(), today=new Date().getDay(), tom=(today+1)%7;
  const edC=((S.ed&&S.ed.cours)||[]), edToday=edC.filter(c=>c.d===dkey(Date.now())), edTom=edC.filter(c=>c.d===dkey(Date.now()+DAY));
  const nmC=m=>{const n=normMatiere(m);return MATIERES.some(x=>x.n===n)?n:String(m).replace(/^E\d+\s*-\s*/i,'').toLowerCase().replace(/^./,x=>x.toUpperCase())}; const fmtC=c=>`${c.annule?'<s>':''}${c.h} ${matInfo(normMatiere(c.m)).e} ${esc(nmC(c.m))}${c.annule?'</s> ❌':''}${c.modif&&!c.annule?' ⚠️':''}`;
  const cours=E[today]||[], demain=E[tom]||[], nd=dueCards().length, ex=upcomingExams()[0], dv=dueSoon();
  const mood=h<12?['☀️','Ta journée','morning']:h<18?['🌤️',"Ton après-midi",'day']:['🌙','Ta soirée','night'];
  const date=(d=>d.charAt(0).toUpperCase()+d.slice(1))(new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}));
  const rows=[];
  if(h<17&&edToday.length) rows.push(`🏫 Aujourd'hui : ${edToday.filter(c=>c.f>=new Date().toTimeString().slice(0,5)).map(fmtC).join(' · ')||'cours terminés ✅'}`);
  else if(h<17&&cours.length) rows.push(`🏫 En cours aujourd'hui : ${cours.map(n=>`${matInfo(n).e} ${esc(n)}`).join(' · ')}`);
  if(h>=17&&edTom.length) rows.push(`🏫 Demain : ${edTom.map(fmtC).join(' · ')}`);
  else if(h>=17&&demain.length) rows.push(`🏫 Demain en cours : ${demain.map(n=>`${matInfo(n).e} ${esc(n)}`).join(' · ')}`);
  if(nd) rows.push(`🃏 ${nd} carte${nd>1?'s':''} à revoir`);

  if(ex) rows.push(`📅 ${esc(ex.titre||'Examen')} de ${esc(ex.matiere)} : ${daysTo(ex)===0?"aujourd'hui":daysTo(ex)===1?'demain !':'dans '+daysTo(ex)+' jours'}`);
  if(!rows.length) return '';
  return `<div class="daycard ${mood[2]}" data-go2="edt" style="cursor:pointer"><div class="dc-h"><span>${mood[0]}</span><div><b>${mood[1]}</b><small>${date}</small></div></div>${rows.map(r=>`<div class="dc-r">${r}</div>`).join('')}</div>`;
}

{"lisible":true,"bilan":"2-3 phrases encourageantes et honnêtes","erreurs":[{"type":"connaissance|méthode|compréhension|rédaction|calcul|temps","ce_qui_cloche":"","la_bonne_reponse":""}],"notions":["3 à 6 notions précises à retravailler (2-5 mots chacune)"],"methode":"le conseil de méthode n°1 pour la prochaine fois","points_gagnables":"combien de points il aurait pu gagner facilement et comment"}`,{json:true,images:imgs,tier:'complex'});
        if(A.lisible===false&&!(A.erreurs||[]).length) throw {message:"Je n'arrive pas à lire la copie. Reprends les photos bien à plat, avec de la lumière."};

        await saveDoc(r.id,r); try{const cc=await ensureCopyCourse(r); makeCards(cc).catch(()=>{});}catch(e){} SFX.good(); closeModal(); render(); analyseView(r);

    };
    $('#cpC',m).onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length) go2(f)};

    <div class="fbox ess"><p style="margin:0">${esc(A.bilan||'')}</p></div>
    ${(A.erreurs||[]).length?`<div class="fbox trap" style="margin-top:10px"><h4>❌ Où tu as perdu des points</h4>${A.erreurs.map(x=>`<div style="padding:6px 0;border-bottom:1px dashed var(--line)"><span class="tag">${esc(x.type)}</span> ${esc(x.ce_qui_cloche)}${x.la_bonne_reponse?`<div style="margin-top:4px;color:var(--good)">✅ ${esc(x.la_bonne_reponse)}</div>`:''}</div>`).join('')}</div>`:''}
    ${A.points_gagnables?`<div class="fbox mnemo" style="margin-top:10px"><h4>💎 Points faciles à récupérer</h4><p style="margin:0">${esc(A.points_gagnables)}</p></div>`:''}
    ${A.methode?`<div class="fbox" style="margin-top:10px"><h4>🛠️ Pour la prochaine fois</h4><p style="margin:0">${esc(A.methode)}</p></div>`:''}
    ${(A.notions||[]).length?`<h3 style="margin:14px 0 6px">🎯 On retravaille</h3><div class="row" style="flex-wrap:wrap">${A.notions.map(n=>`<button class="btn sm" data-fq="${esc(n)}">🎯 ${esc(n)}</button>`).join('')}</div>`:''}
    <div class="anact"><button class="cta" id="anQ">🎯 Quiz sur mes erreurs</button><button class="btn" id="anC">🃏 Cartes mémoire</button></div>
    <div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn ghost" id="anX">Plus tard</button></div>`,m=>{
    $('#anX',m).onclick=closeModal;
    $('#anQ',m).onclick=async()=>{const c=await ensureCopyCourse(r);closeModal();go('course',c.id,'quiz');};
